services:
  init-volumes:
    image: mua-bot:local
    pull_policy: never
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -ec
      - |
        chown -R 10001:10001 /mnt/mua-data /mnt/feishu-home
        chmod 700 /mnt/mua-data /mnt/feishu-home /mnt/napcat-config /mnt/qq-session
    volumes:
      - /var/lib/docker/volumes/mua-bot-data/_data:/mnt/mua-data
      - /var/lib/docker/volumes/mua-bot-feishu-home/_data:/mnt/feishu-home
      - /var/lib/docker/volumes/mua-bot-napcat-config/_data:/mnt/napcat-config
      - /var/lib/docker/volumes/mua-bot-qq-session/_data:/mnt/qq-session

  mua-bot:
    image: mua-bot:local
    build:
      context: .
      args:
        INSTALL_FEISHU_CLI: ${INSTALL_FEISHU_CLI:-false}
        FEISHU_CLI_PACKAGE: ${FEISHU_CLI_PACKAGE:-}
    restart: unless-stopped
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    volumes:
      - /var/lib/docker/volumes/mua-bot-data/_data:/app/data
      # 持久化飞书 CLI 可能写入 ~/.config、~/.local 等位置的真人账号登录态。
      - /var/lib/docker/volumes/mua-bot-feishu-home/_data:/home/mua
    ports:
      - "${MUA_GUI_BIND_IP:-0.0.0.0}:${MUA_GUI_PORT:-6688}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # 可选真人 QQ OneBot 侧车。首次使用需阅读所选镜像的当前文档并完成扫码登录。
  # 非官方协议可能违反平台条款、触发风控或封号；建议使用专用低权限账号。
  qq-bridge:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    user: "${NAPCAT_UID:-0}:${NAPCAT_GID:-0}"
    restart: unless-stopped
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    environment:
      ACCOUNT: ${QQ_ACCOUNT:-}
    volumes:
      - /var/lib/docker/volumes/mua-bot-napcat-config/_data:/app/napcat/config
      - /var/lib/docker/volumes/mua-bot-qq-session/_data:/app/.config/QQ
    ports:
      - "${NAPCAT_WEBUI_BIND_IP:-0.0.0.0}:${NAPCAT_WEBUI_PORT:-6099}:6099"
      - "127.0.0.1:${ONEBOT_HTTP_PORT:-6000}:3000"
