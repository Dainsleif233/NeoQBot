name: neoqbot

services:
  init-volumes:
    image: neoqbot:local
    pull_policy: never
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -ec
      - |
        umask 077
        if [ ! -f /app/config.example.yaml ]; then
          echo "NeoQBot image is missing /app/config.example.yaml; rebuild the image from the complete repository." >&2
          exit 66
        fi
        if [ ! -f /mnt/neoqbot-data/config.yaml ]; then
          cp /app/config.example.yaml /mnt/neoqbot-data/config.yaml
        fi
        neoqbot init-napcat \
          --napcat-config-dir /mnt/napcat-config \
          --secret-dir /mnt/neoqbot-data/secrets \
          --webhook-url http://neoqbot:8080/webhooks/onebot/default
        chown -R 10001:10001 /mnt/neoqbot-data /mnt/feishu-home
        chmod 600 /mnt/neoqbot-data/config.yaml /mnt/neoqbot-data/secrets/napcat-onebot.token /mnt/neoqbot-data/secrets/napcat-webui.token /mnt/neoqbot-data/secrets/admin-api.token /mnt/neoqbot-data/secrets/gui-bootstrap-password
        chmod 700 /mnt/neoqbot-data /mnt/feishu-home /mnt/napcat-config /mnt/qq-session
        chmod 755 /mnt/napcat-cache
    volumes:
      - neoqbot-data:/mnt/neoqbot-data
      - neoqbot-feishu-home:/mnt/feishu-home
      - neoqbot-napcat-config:/mnt/napcat-config
      - neoqbot-qq-session:/mnt/qq-session
      - neoqbot-napcat-cache:/mnt/napcat-cache

  neoqbot:
    image: neoqbot:local
    build:
      context: .
      args:
        INSTALL_FEISHU_CLI: ${INSTALL_FEISHU_CLI:-false}
        FEISHU_CLI_PACKAGE: ${FEISHU_CLI_PACKAGE:-}
    restart: unless-stopped
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内部监听所有接口；宿主机发布地址由 NEOQBOT_GUI_BIND_IP 控制。
      NEOQBOT_CONFIG: /app/data/config.yaml
      NEOQBOT_APP__HOST: 0.0.0.0
    command:
      - sh
      - -ec
      - umask 077; exec neoqbot serve
    volumes:
      - neoqbot-data:/app/data
      # 持久化飞书 CLI 可能写入 ~/.config、~/.local 等位置的真人账号登录态。
      - neoqbot-feishu-home:/home/neoqbot
      # NapCat 在未登录时持续更新此二维码；后台只读并通过登录后的 GUI 提供。
      - neoqbot-napcat-cache:/app/napcat-cache:ro
    ports:
      - "${NEOQBOT_GUI_BIND_IP:-0.0.0.0}:${NEOQBOT_GUI_PORT:-6688}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # 可选真人 QQ OneBot 侧车。部署不等待交互登录；启动后在 NeoQBot GUI 扫描共享缓存中的二维码。
  # 非官方协议可能违反平台条款、触发风控或封号；建议使用专用低权限账号。
  qq-bridge:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    user: "${NAPCAT_UID:-0}:${NAPCAT_GID:-0}"
    restart: unless-stopped
    stdin_open: false
    tty: false
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    environment:
      ACCOUNT: ${QQ_ACCOUNT:-}
    volumes:
      - neoqbot-napcat-config:/app/napcat/config
      - neoqbot-qq-session:/app/.config/QQ
      - neoqbot-napcat-cache:/app/napcat/cache
    # 仅在 Compose 内部网络提供给 NeoQBot，不占用宿主机端口。
    expose:
      - "6099"
      - "3000"

volumes:
  neoqbot-data:
  neoqbot-feishu-home:
  neoqbot-napcat-config:
  neoqbot-qq-session:
  neoqbot-napcat-cache:
