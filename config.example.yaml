app:
  environment: development
  host: 0.0.0.0
  port: 8080
  timezone: Asia/Shanghai
  log_level: INFO
  database_path: data/neoqbot.db
  # 纯记录群消息按 Bot/群号/日期写入 JSONL；Docker 中位于持久化数据卷。
  message_archive_path: data/group-message-records
  # 生产环境请通过 NEOQBOT_APP__ADMIN_API_TOKEN 注入随机长令牌。
  admin_api_token: ""
  # 首次联调务必保持 true；确认收发链路后再关闭。
  dry_run: true

qq:
  # 每个账号是独立 Bot 节点；NapCat 反向 HTTP 地址为 /webhooks/onebot/<bot-id>。
  bots:
    - id: default
      name: 默认 QQ Bot
      enabled: true
      # Compose 内使用服务名；Windows 本地直连外部 NapCat 时可改为 http://127.0.0.1:3000。
      onebot_base_url: http://qq-bridge:3000
      # Compose 自动生成随机 Token 并写入持久卷；文件存在时优先于明文值。
      access_token: ""
      access_token_file: /app/data/secrets/napcat-onebot.token
      webhook_secret: ""
      request_timeout_seconds: 15
      webui_base_url: http://qq-bridge:6099
      webui_token: ""
      webui_token_file: /app/data/secrets/napcat-webui.token
      webui_public_url: ""
      webui_public_port: 6099
      qrcode_path: /app/napcat-cache/qrcode.png
      # managed_group_ids 由下方编排图中的 manages/observes 连接生成。
      managed_group_ids: []
      administrator_qq_ids: ["10001"]
      announcement_actions: [get_group_notice, _get_group_notice]
      search_feishu_bot_id: ""
      tasks:
        join_management:
          enabled: true
          detect_requests: true
          execute_management: true
          auto_approve: false
          auto_reject: false
          minimum_confidence: 0.88
        message_detection:
          enabled: true
          record_only: false
          realtime_detection: true
          polling_detection: true
          analyze: true
          handle: true
          interval_minutes: 30
          window_minutes: 5
          risk_threshold: 0.7
          max_messages_per_run: 300
        announcement_sync:
          enabled: false
          auto_sync: false
          sync_interval_minutes: 30
          sync_on_startup: false
          feishu_bot_id: ""

llm:
  # rules 可离线联调；生产建议切到 openai_compatible 并配置 Agnes AI。
  driver: rules
  base_url: https://your-agnes-endpoint.example/v1
  api_key: ""
  model: your-agnes-model
  timeout_seconds: 60
  temperature: 0
  max_retries: 2
  # 如果 Agnes 端点不接受 OpenAI response_format 参数，改为 false。
  json_response_format: true

join_approval:
  enabled: true
  # 首次上线保持 false，观察审核日志后再开启。
  auto_approve: false
  auto_reject: false
  minimum_confidence: 0.88
  policy: >-
    申请者必须说明加入目的、所在服务器或组织，并明确同意群规。内容模糊、身份无法
    判断、疑似广告或规避审核时转人工。不得根据性别、地域等无关个人属性作决定。
  required_keywords:
    - 同意群规
  forbidden_keywords:
    - 代充
    - 刷单

moderation:
  enabled: true
  interval_minutes: 30
  window_minutes: 5
  risk_threshold: 0.7
  max_messages_per_run: 300
  policy: >-
    识别违法违规、涉政、色情、仇恨或群体对立、人身攻击、骚扰、诈骗、泄露隐私及
    其他违反群规的内容。结合上下文，普通新闻讨论、反驳违规观点或引用不得仅凭关键
    词判违规。机器人只通知管理员，不自动禁言或踢人。
  # 仅供 rules 离线模式联调；真实生产请依赖模型复核上下文。
  rule_keywords:
    scam:
      - 刷单
      - 返利
    harassment:
      - 人肉

announcements:
  enabled: true
  sync_interval_minutes: 30
  sync_on_startup: true

feishu:
  bots:
    - id: default
      name: 默认飞书 Bot
      enabled: false
      driver: disabled
      # 填写当前飞书 CLI 的实际可执行文件。
      executable: feishu
      timeout_seconds: 60
      search_prefixes: ["搜索 ", "查询 ", "/search "]
      max_search_results: 5
      # 模板只填写 executable 后面的参数；每项是独立 argv，不经过 shell。
      command_templates: {}
      archive_payload_stdin: false
      # 多飞书账号可分别设置 HOME/配置目录等变量来隔离 CLI 登录态。
      extra_environment: {}

orchestration:
  # 资源支持 qq_group、feishu_group、knowledge_base；画布坐标保存在 layout。
  resources:
    - id: qq-group-main
      kind: qq_group
      name: 主群
      external_id: "123456789"
      description: ""
      enabled: true
      metadata: {}
  edges:
    - id: default-manages-main
      source: qq-bot:default
      target: qq-group-main
      relation: manages
      enabled: true
  layout: {}

runtime:
  event_workers: 2
  shutdown_grace_seconds: 15

retention:
  enabled: true
  message_days: 30
  join_request_days: 180
  moderation_run_days: 365
  audit_days: 365

gui:
  enabled: true
  bootstrap_username: admin
  bootstrap_password: neoqbotadmin
  session_hours: 12
  # 直接 HTTP 访问时保持 false；经 HTTPS 反向代理后改为 true。
  secure_cookie: false
