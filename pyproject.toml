[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoqbot"
version = "0.4.0"
description = "Auditable multi-platform bot, group, and knowledge orchestration control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "NeoQBot contributors" }]
keywords = ["bot", "qq", "feishu", "onebot", "orchestration", "moderation"]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
]

[project.urls]
Homepage = "https://github.com/LYOfficial/NeoQBot"
Repository = "https://github.com/LYOfficial/NeoQBot"
Issues = "https://github.com/LYOfficial/NeoQBot/issues"

[project.scripts]
neoqbot = "neoqbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neoqbot = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/img/neoqbot-logo.png",
  "web/img/neoqbot-logo.svg",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
